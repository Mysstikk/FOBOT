###############################################
# Modify all parameters related to servoing here
###############################################

# Optionally override Servo's internal velocity scaling when near singularity or collision (0.0 = use internal velocity scaling)
# override_velocity_scaling_factor = 0.0 # valid range [0.0:1.0]

## Properties of outgoing commands
publish_period: 0.033  # 1/Nominal publish rate [seconds]
max_expected_latency: 0.1  # delay between sending a command and the robot executing it [seconds]

command_in_type: "speed_units"  # "unitless"> in the range [-1:1], as if from joystick. "speed_units"> cmds are in m/s and rad/s
scale:
  # Scale parameters are only used if command_in_type=="unitless"
  linear:  0.1  # Max linear velocity. Unit is [m/s]. Only used for Cartesian commands.
  rotational:  0.4  # Max angular velocity. Unit is [rad/s]. Only used for Cartesian commands.

# What type of topic does your robot driver expect?
# Currently supported are std_msgs/Float64MultiArray or trajectory_msgs/JointTrajectory
command_out_type: std_msgs/Float64MultiArray

# What to publish? Can save some bandwidth as most robots only require positions or velocities
publish_joint_positions: true
publish_joint_velocities: false
publish_joint_accelerations: false

check_octomap_collisions: true  # Check collision against the octomap (if a 3D sensor plugin is available)

## MoveIt properties
move_group_name: fobot_arm  # Often 'manipulator' or 'arm'
# drift_dimensions: []

planning_frame: base_link
ee_frame_name: link_tcp
robot_link_command_frame: link_tcp
## Configure handling of singularities and joint limits
lower_singularity_threshold: 500.0  # Start decelerating when the condition number hits this (close to singularity)
hard_stop_singularity_threshold: 2000.0  # Stop when the condition number hits this
leaving_singularity_threshold_multiplier: 1.0  # Multiply the hard stop limit by this when leaving singularity (see https://github.com/moveit/moveit2/pull/620)

## Topic names
joint_topic: /joint_states  # Get joint states from this topic
status_topic: ~/status  # Publish status to this topic
command_out_topic: /fobot_joint_controller/commands  # Publish outgoing commands here

## Collision checking for the entire robot body
check_collisions: true  # Check collisions?
collision_check_rate: 10.0  # [Hz] Collision-checking can easily bog down a CPU if done too often.
self_collision_proximity_threshold: 0.01  # Start decelerating when a self-collision is this far [m]
scene_collision_proximity_threshold: 0.01  # Start decelerating when a scene collision is this far [m]
